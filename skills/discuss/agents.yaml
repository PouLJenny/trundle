# trundle-discuss —— agent 适配库
#
# 声明「某个 CLI 怎么调」。用户选了哪些、各自站位是什么,在名册里
# (~/.config/trundle/roster.yaml,旧路径 ~/.claude/trundle-discuss/ 自动回退),不在这个文件——本文件会随 skill 更新被覆盖。
#
# 新增一个 agent 要填满九个字段,见 references/adapting-new-cli.md。
# 字段集合来自实测:比"六字段就能覆盖"的初始设想多出 trust(两家主流 CLI
# 都有信任目录门禁,绕过有真实代价)、stream(事件流粒度决定超时怎么判)
# 和 set_env(只读约束不一定是 flag,dsh 就只有环境变量)。
#
# ★ 这里没有 stance ★
# 站位是「讨论里的位置」,不是 CLI 的属性 —— 库作者既不知道用户装了哪些 agent,
# 也不该替所有场次预定立场。把它写在这里还有第二个坏处:适配库随 skill 更新被
# 覆盖,而站位是用户偏好,两者生命周期不同,写在一起必然漂(本项目实测漂过:
# 这里给 codex 写的是「盯实现代价」,用户名册里是「盯证据链」)。
# 站位现在只存在于名册(~/.config/trundle/roster.yaml,旧路径自动回退),且是可选的。

defaults:
  # 超时不是墙钟,是「吐字间隔」。只要 agent 还在出事件(读文件、思考、吐字)
  # 就一直等 —— 固定墙钟会在 agent 明明干得好好的时候把它砍掉。
  #
  # ★ idle 必须按 stream 粒度分别定,不能用一个全局值 ★
  # 实测教训:codex 只有 item 级事件,**生成最终回答的全过程一个事件都不发**。
  # 实测一次 8.0K 字的回答静默了约 70s,上下文更大时轻松破 90s ——
  # 用 90s 卡它,恰好砍在它要说出正文那一刻,而日志上看起来像"它卡死了"。
  # 所以 codex 单独给 300s(见下),token 级的 gemini/claude 才用 90s。
  idle: 90              # 秒。连续这么久没有任何事件才判定卡死(各 agent 可覆盖)
  first_byte_grace: 180 # 首个事件前的宽限。实测 gemini 要 42s 才出首字节
  # 绝对上限。空闲超时防不住工具循环 —— agent 可以一直"活跃"地反复读同一批
  # 文件。540 不是 600:Claude Code 的 Bash 工具最大 timeout 就是 600s,
  # 本脚本必须先于它开枪,否则调用方连失败分类都拿不到。
  max_wall: 540
  parallel: true        # 多 agent 各一个 reader 线程,总耗时取 max 而非 sum

  # stream 取值,决定超时怎么判:
  #   token —— 有 token 级 delta,空闲超时最灵敏
  #   item  —— 只有阶段性事件(工具调用/整条消息),空闲超时按阶段判
  #   none  —— 没有任何活动信号,只能退化成墙钟。接纳前必须实测,猜不出来
  #            (dsh 就是这一档,见下 —— 它同时也是墙钟为什么可以按 agent
  #             单独收紧的理由:无流意味着卡死没有任何征兆)

# ─────────────────────────────────────────────────────────────
# 所有 agent 通用的调用纪律(踩过的坑,勿删)
# ─────────────────────────────────────────────────────────────
invocation_rules:
  # 并行调用时 stdin 变成不可读管道,codex 会检测到 "stdin is piped"
  # 然后尝试读取并失败(os error 11)。所有调用必须显式重定向。
  stdin: /dev/null

  # 子进程无状态,每次调用都要完整传入上下文(见 references/prompt-kit.md)
  stateless: true

  # 不要硬编码模型名。实测 gemini-2.5-flash 已对新用户下线,
  # 硬编码等于给自己埋一颗定时炸弹。留空走各 CLI 的默认路由。
  pin_model: false

# ─────────────────────────────────────────────────────────────
# ★ 这个文件是文档,不是配置 ★
#
# 没有任何代码读它。真值是 scripts/invoke.py 的 AGENTS 字典 —— 因为那里的
# build / parse / precheck 是 Python 函数对象,YAML 表达不了,所以「让代码读
# yaml」这条路在这个项目里天然走不通。
#
# 但它也不是随便写写:selftest.py 会断言这里的名单、stream、idle、max_wall
# 与 AGENTS 一致,对不上就红。改代码不改这里,CI 会拦住。
#
# 下面几对字段名两边不同,那是**声明式描述 vs 实现**,不是待统一的重名,
# 不要去「修」它们:
#   cmd + noninteractive_flags + readonly_flags  ←→  build(返回 argv 的函数)
#   extract                                      ←→  parse + Run.body() 优先级
#   trust.check                                  ←→  precheck
#   defaults.first_byte_grace / idle / max_wall  ←→  GRACE / IDLE_DEFAULT / MAXWALL
# 真正同名同义的是:stream、idle、max_wall、probe、unset_env、set_env。
# ─────────────────────────────────────────────────────────────
agents:

  codex:
    verified: true                    # 实测通过 B1-B3(2026-08)
    cmd: codex exec --json {flags} {prompt}
    noninteractive_flags: []          # codex exec 本身即非交互模式
    # 只读沙箱。注意 --full-auto 是废弃兼容 flag,不要用
    readonly_flags: ["--sandbox", "read-only"]
    # --json 让 stdout 变成 JSONL 事件流。正文取最后一条
    # item.completed 且 item.type == agent_message 的 .item.text ——
    # 与官方 -o/--output-last-message 同义,但少一个临时文件。
    extract: jsonl:item.completed/agent_message
    stream: item                      # 事件粒度:工具调用 / 整条消息,无 token delta
    # ★ 300 不是 90 ★ item 级粒度意味着生成回答期间完全静默。
    # 实测:一次 8.0K 字的回答静默约 70s;讨论场景上下文更大时会破 90s。
    # codex 没有开启 token 级事件的开关(features list 里 apply_patch_streaming_events
    # 和 concurrent_reasoning_summaries 都是 under development,且都覆盖不到
    # 最终回答的生成阶段),所以只能在超时侧让步。上限仍受 max_wall 约束。
    idle: 300
    # JSONL 里的 item.type == "error" 常常是无害警告(实测那条
    # "Skill descriptions were shortened" 就是),不能据此判失败
    auth_env: []                      # 复用 ~/.codex 已有登录态
    probe: codex exec --sandbox read-only "说一句话"   # 卡在启动阶段时印给用户的诊断命令
    trust:
      # codex 要求 cwd 在 git repo 内,否则拒绝启动。
      # 非 repo 目录用该 flag 放行,无副作用(与 gemini 不同)。
      check: git_repo
      bypass_flags: ["--skip-git-repo-check"]
      bypass_safe: true
    latency_observed: "7-13s"

  gemini:
    verified: true
    cmd: gemini {flags} -o stream-json -p {prompt}
    noninteractive_flags: []          # -p 在非 TTY 下即 headless
    readonly_flags: ["--approval-mode", "plan"]   # plan 模式可读可搜,不可写不可执行
    # -o stream-json 给 token 级 delta。正文 = 拼接所有
    # type==message && role==assistant && delta==true 的 .content。
    # (不用一次性的 --output-format json:那样正文埋在 .response 里,而且
    #  整轮零活动信号,空闲超时无从判起。)
    extract: jsonl:message/assistant/delta
    stream: token
    idle: 90                          # token 级 delta,没动静就是真没动静
    auth_env: []                      # ~/.gemini/settings.json 已配认证
    probe: gemini -p "说一句话"        # 卡在启动阶段时,印给用户在终端手动跑的诊断命令
    # ★ 额度耗尽的表现是「静默挂起」,不是报错 ★
    #
    # 免费层额度很小(实测 generate_content_free_tier_requests limit: 5),
    # 跑几轮讨论就会撞上。耗尽后 gemini **不报错**,而是按 ~61s 间隔内部退避重试。
    # 实测:无 TTY 时 100s 内 stdout 只有 init 和 prompt 回显、stderr 只有一条
    # 颜色警告,限流关键词零命中 —— 从事件流里根本认不出来,只会被判成卡死。
    # 同一时刻同样的调用在终端里会打出 "You exceeded your current quota"。
    #
    # 所以:(a) 失败说明必须给出 probe 命令,让用户自己去终端看真实原因;
    #       (b) classify() 在报 timeout 前先查限流,别让 429 被"卡死"盖掉。
    # 别指望自动识别这个场景 —— 试过,配额窗口滚动后无法稳定复现。
    trust:
      # ★ 这里是整个适配库最重要的一条,不要图省事 ★
      #
      # 实测:在未 trust 的目录下用环境变量绕过信任检查,模型路由会降级到
      # 一个不稳定的 preview 分支——8 次请求失败 7 次,墙钟从 14s 恶化到 108-199s。
      # 在已 trust 的目录里则路由到稳定分支,1 请求 0 失败,6.4s。
      #
      # 所以:绝不 bypass,而是前置检查 + 引导用户 trust。
      # (那个绕过用的环境变量名故意不写在这里,免得被顺手复制进代码。
      #  全仓库只有 SKILL.md 的铁律里出现过一次,那是为了指名禁止 ——
      #  主持人 Claude 才是可能被要求去绕过的那一方,它需要认得出来。)
      check: gemini_trusted_folder
      config: ~/.gemini/trustedFolders.json
      bypass_safe: false              # ← 10x 延迟惩罚,不许自动降级
      remedy: |
        在该目录下交互式跑一次 gemini 并选择 trust,
        或在 ~/.gemini/trustedFolders.json 里加入 "<dir>": "TRUST_FOLDER"
    latency_observed: "6-14s"

  claude:
    verified: true
    # 注意:这是作为「参与者」的 claude CLI 子进程,
    # 与运行本 skill 的主持人 Claude 不是一回事,不能被 @ 混淆。
    cmd: claude {flags} --output-format stream-json --verbose --include-partial-messages -p {prompt}
    # --verbose 是 stream-json 在 -p 模式下的硬要求;
    # --include-partial-messages 才有 token 级 delta。
    # 这两个不是为了好看:claude 的纯文本模式实测「54s 内 0 字节,然后一把吐
    # 3926 字节」—— 整轮没有任何活动信号,空闲超时根本无从判起。
    noninteractive_flags: []
    readonly_flags: ["--allowedTools", "Read,Glob,Grep"]   # 白名单里没有写工具
    extract: jsonl:result           # 正文取末条 type==result 的 .result,权威且已去重
    stream: token
    idle: 90                        # 思考阶段也有 thinking_delta,不会假性静默
    # 必须清掉这个变量,否则子进程认为自己在嵌套 session 里而报错
    unset_env: ["CLAUDECODE"]
    auth_env: []
    probe: claude -p "说一句话"       # 卡在启动阶段时印给用户的诊断命令
    trust:
      check: none
    latency_observed: "13-30s"

  dsh:
    verified: true                    # 实测通过 ①-⑤(@deepseek-ai/dsh 0.1.0-rc.6,2026-08)
    cmd: dsh --profile headless {prompt}
    # 唯一的一次性问答入口。任务是**位置参数**,不读 stdin
    # (help 里除 -h 外没有任何 flag)。
    noninteractive_flags: ["--profile", "headless"]
    # ★ 库里第一个「只读不靠 flag」的条目 ★
    # dsh 没有任何只读 flag。只读靠环境变量:headless profile 的 sandbox mode
    # 默认是 process.env.DSH_PERMISSION_MODE ?? 'workspace-write'
    # —— **默认可写**,不显式改就等于给它写权限。
    # 合法取值:read-only | workspace-write | danger-full-access
    readonly_flags: []
    set_env: {DSH_PERMISSION_MODE: read-only}
    # 实测只读硬度(比 gemini 的 --approval-mode plan 更硬):
    #   让它建文件 → 被沙箱拒绝,目录里确认零文件生成
    #   走 bash 逃逸 `echo hello > f.txt` → bash: Read-only file system
    #   它尝试自行升级 → sandbox escalation to "workspace-write" requires
    #     approval, but no approval channel is available
    #   headless 下没有审批通道,绕不过去。
    # 注意 invoke.py 是**覆盖**用户环境而不是继承:用户环境里若已有
    # workspace-write,"尊重它"等于把只读铁律交给一个环境变量决定。
    # 另有 DSH_TOOLS_MODE(native|code,默认 native)。与只读无关,未验证 code
    # 模式下的表现,所以不 pin 也不动 —— 记在这里是为了将来出问题有线索。
    extract: text:stdout              # ★ 库里唯一不是 jsonl 的 ★
    # ★ stream: none —— 它没有事件流,这是接纳它的全部难点所在 ★
    # 实测:1044 字节的回答,首字节和最后一字节都在同一个 8.36s 时刻到达;
    # 全程 stdout 零输出,没有事件、没有 JSON、没有进度信号。
    # 源码印证(@deepseek-ai/dsh-headless):await agent.whenIdle() 跑到静止,
    # 然后 io.stdout.write(outcome.text + "\n") 一次性写出。
    stream: none
    # idle 留空不是漏填:空闲超时对它**无意义**。它整轮不吐字,再大的 idle 也
    # 只是把误杀推迟。invoke.py 的 watch() 对 stream=="none" 的 agent 直接跳过
    # idle/GRACE 判定,超时文案也是单独一套(NO_STREAM_MSG),明说另外两个旋钮
    # 不通电。详见 references/adapting-new-cli.md 的「没有事件流的 CLI 怎么办」。
    idle: null
    # ★ 墙钟是它唯一的护栏 ★ 无流意味着「卡死」和「正常工作」长得一模一样,
    # 中途没有任何信号能区分。曾收紧到 300,但实际使用中 dsh 的重 prompt
    # 会超过它,放宽到全局同款 540 —— 这已是上限:不能给 600,Bash 工具
    # 自己就在 600s 开枪,必须留余量让 invoke.py 先收尾,否则整轮输出全丢。
    max_wall: 540
    auth_env: []                      # 复用 dsh 自己的登录态
    probe: DSH_PERMISSION_MODE=read-only dsh --profile headless "说一句话"
    trust:
      check: none
      # 无 --resume、无会话续接、每次全新 session —— 天然满足「子进程无状态」
    # TODO 限流表现未实测。is_rate_limited() 的通用标记(rate limit / 429 /
    # too many requests)碰巧命中就命中。不猜 DeepSeek 的限流原话 —— gemini
    # 那条 "exceeded your current quota" 是实测来的才敢写。真撞上再补。
    latency_observed: "4.3s(trivial)/8.4s(300字回答)/28.6-34.6s(读文件+写600字判断)"

# ─────────────────────────────────────────────────────────────
# 还没适配的
#
# 只收实测跑通的条目。没验证过的写进来是负债——用户选中它、它不工作,
# 比"压根没这个选项"更糟。
#
# 以下 CLI 本机可见但尚未适配,discover.sh 会把它们列为「发现但未登记」并提示:
#   opencode   `opencode run <msg>`,只读模式待确认
#   cline      `cline -p --json <msg>`,实测 90s 无响应(疑似需先配置账号)
#   kiro-cli   `kiro-cli chat`,非交互与只读 flag 都待确认
#
# 想加进来:按 references/adapting-new-cli.md 跑完验证再提 PR。
# 只读 flag 必须实测,不能猜。
